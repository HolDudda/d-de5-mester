<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7b1f1f">
  <title>D&D 5e - Guia do Mestre</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="btn-menu">☰</button>
      <h1 id="titulo-pagina">D&D 5e Master</h1>
      <div id="dado-rapido" title="Rolar d20">🎲</div>
    </header>
    <main id="conteudo"></main>
    <nav id="bottom-nav">
      <button data-nav="pagina-inicio" class="ativo">🏠<span>Início</span></button>
      <button data-nav="criar-personagem">⚔️<span>Personagem</span></button>
      <button data-nav="minhas-campanhas">🗺️<span>Campanha</span></button>
      <button data-nav="combate">🎯<span>Combate</span></button>
      <button data-nav="compendio">📖<span>Compêndio</span></button>
    </nav>
  </div>
  <div id="modal-dado" class="modal escondido">
    <div class="modal-box">
      <h3 id="dado-resultado">--</h3>
      <p id="dado-descricao">Role um dado</p>
      <button onclick="fecharModalDado()">OK</button>
    </div>
  </div>

  <script>
    // --- CORREÇÃO DE SEGURANÇA E CARREGAMENTO ---
    
    // Define a função global antes do módulo carregar
    window.fecharModalDado = function() {
      const m = document.getElementById('modal-dado');
      if (m) m.classList.add('escondido');
    };

    // Carrega o app.js de forma assíncrona e segura
    window.addEventListener('load', () => {
      const script = document.createElement('script');
      script.type = 'module';
      script.src = './js/app.js';
      script.onerror = () => {
        console.error("Erro ao carregar js/app.js. Verifique os caminhos das pastas.");
        document.getElementById('conteudo').innerHTML = '<div style="padding:20px;color:white;text-align:center;"><h3>Erro de Carregamento</h3><p>Não foi possível achar o arquivo js/app.js</p></div>';
      };
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
