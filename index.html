<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7b1f1f">
  <title>D&D 5e - Guia do Mestre</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">

<body>

    <main id="conteudo"></main>

      <button data-nav="minhas-campanhas">🗺️<span>Campanha</span></button>

      <button data-nav="compendio">📖<span>Compêndio</span></button>
    </nav>
  </div>
  <div id="modal-dado" class="modal escondido">
    <div class="modal-box">
      <h3 id="dado-resultado">--</h3>
      <p id="dado-descricao">Role um dado</p>
      <button onclick="fecharModalDado()">OK</button>
    </div>
  </div>

</html>
