<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#7b1f1f">
<title>D&D 5e Master</title>
<style>
:root{--bg:#0f0d0a;--bgc:#1e1a15;--bgh:#2a241d;--bd:#4a3f30;--ac:#b8862f;--acl:#d4a84f;--dg:#a83232;--sc:#4a8f3f;--tx:#e8dcc4;--td:#a89a80;--r:12px;--sb:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Georgia,serif;background:var(--bg);color:var(--tx);font-size:16px;overscroll-behavior:none;user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(180deg,#7b1f1f,#4a1010);border-bottom:2px solid var(--ac);flex-shrink:0}
#topbar h1{flex:1;font-size:1.05rem;font-weight:600}
#btn-menu,#dado-rapido{background:rgba(255,255,255,.1);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
#dado-rapido{font-size:1.5rem}
#btn-menu:active,#dado-rapido:active{background:rgba(255,255,255,.25)}
#conteudo{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(80px + var(--sb));-webkit-overflow-scrolling:touch}
.hero{text-align:center;padding:24px 8px;background:radial-gradient(circle at center,#3a1f1f,transparent 70%);border-radius:var(--r);margin-bottom:20px}
.hero h2{font-size:1.8rem;color:var(--acl);margin-bottom:8px;text-shadow:0 0 20px rgba(184,134,47,.4)}
.hero p{color:var(--td);font-size:.95rem}
.grid-menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card-menu{display:flex;flex-direction:column;align-items:flex-start;padding:16px;gap:4px;background:var(--bgc);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);cursor:pointer;text-align:left;min-height:110px;transition:transform .1s}
.card-menu:active{background:var(--bgh);border-color:var(--ac);transform:scale(.97)}
.card-menu .icon{font-size:1.8rem}
.card-menu .label{font-size:.95rem;font-weight:600;color:var(--acl)}
.card-menu .desc{font-size:.72rem;color:var(--td);line-height:1.3}
#bottom-nav{display:flex;background:#1a1410;border-top:2px solid var(--ac);padding-bottom:var(--sb);flex-shrink:0}
#bottom-nav button{flex:1;background:none;border:none;padding:8px 4px;color:var(--td);font-size:1.2rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#bottom-nav button span{font-size:.62rem;font-family:sans-serif}
#bottom-nav button.ativo{color:var(--acl)}
.painel{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px}
.painel h3{font-size:1.05rem;color:var(--acl);margin-bottom:10px;border-bottom:1px solid var(--bd);padding-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;background:var(--ac);color:#1a1410;font-weight:700;border:none;border-radius:8px;font-size:.95rem;cursor:pointer;min-height:44px;font-family:inherit;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn-block{display:flex;width:100%;margin-top:10px}
.btn-sec{background:var(--bgh);color:var(--tx);border:1px solid var(--bd)}
.btn-danger{background:var(--dg);color:#fff}
.btn-info{background:#4a6fa8;color:#fff}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
label{display:block;margin-bottom:6px;font-size:.85rem;color:var(--td)}
input,select,textarea{width:100%;padding:12px;background:#0a0805;border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:.95rem;font-family:inherit;margin-bottom:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.lista-opcoes{display:flex;flex-direction:column;gap:8px}
.opcao{padding:12px 14px;background:var(--bgh);border:2px solid var(--bd);border-radius:8px;cursor:pointer;transition:all .15s}
.opcao:active{transform:scale(.98)}
.opcao.selecionada{border-color:var(--ac);background:rgba(184,134,47,.15)}
.opcao .nome{font-weight:700;color:var(--acl)}
.opcao .extra{font-size:.8rem;color:var(--td);margin-top:4px}
.ficha{font-family:'Courier New',monospace;font-size:.85rem;line-height:1.5}
.ficha .linha{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--bd);gap:8px}
.ficha .linha:last-child{border:none}
.ficha .linha span:first-child{color:var(--td);flex-shrink:0}
.ficha .linha .valor{color:var(--acl);font-weight:700;text-align:right;word-break:break-word}
.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tabs button{flex-shrink:0;padding:8px 16px;background:var(--bgc);border:1px solid var(--bd);border-radius:20px;color:var(--td);cursor:pointer;font-size:.8rem;font-family:inherit}
.tabs button.ativo{background:var(--ac);color:#1a1410;border-color:var(--ac);font-weight:700}
.badge{display:inline-block;padding:2px 8px;background:var(--bd);border-radius:10px;font-size:.7rem;color:var(--td);margin-left:4px}
.badge.raro{background:#4a6fa8;color:#fff}
.badge.lendario{background:#b8862f;color:#1a1410}
.badge.incomum{background:var(--sc);color:#fff}
.badge.comum{background:#666;color:#fff}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.iniciativa-lista{display:flex;flex-direction:column;gap:6px}
.iniciativa-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bgh);border-radius:8px;border-left:3px solid var(--bd)}
.iniciativa-item.ativo{border-left-color:var(--ac);background:rgba(184,134,47,.15)}
.iniciativa-item.morto{opacity:.35;text-decoration:line-through}
.iniciativa-item .ini{font-weight:700;color:var(--acl);min-width:28px;font-size:.9rem}
.iniciativa-item .nome{flex:1;font-size:.9rem}
.iniciativa-item .hp{font-size:.75rem;color:var(--td)}
.iniciativa-item .hp.baixo{color:var(--dg)}
.log{background:#0a0805;border:1px solid var(--bd);border-radius:8px;padding:12px;font-family:'Courier New',monospace;font-size:.78rem;max-height:280px;overflow-y:auto;line-height:1.6}
.log p{margin-bottom:6px}
.log b{color:var(--acl)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px}
.modal.escondido{display:none}
.modal-box{background:var(--bgc);border:2px solid var(--ac);border-radius:var(--r);padding:24px;text-align:center;max-width:320px;width:100%}
.modal-box h3{font-size:3rem;color:var(--acl);margin-bottom:8px}
.modal-box p{color:var(--td);margin-bottom:16px}
.modal-box button{padding:10px 24px;background:var(--ac);color:#1a1410;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ac);color:#1a1410;padding:12px 20px;border-radius:8px;font-weight:700;z-index:2000;box-shadow:0 4px 12px rgba(0,0,0,.5);max-width:90%;text-align:center;font-size:.85rem}
@media(min-width:600px){.grid-menu{grid-template-columns:repeat(4,1fr)}#conteudo{max-width:720px;margin:0 auto;width:100%}}
</style>
</head>

<div id="app">

    <button id="btn-menu">☰</button>

  <main id="conteudo"></main>

</div>

  </div>
</div>

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function fecharModalDado(){el('modal-dado').classList.add('escondido');}
function mostrarDado(res,desc=''){el('dado-resultado').textContent=res;el('dado-descricao').textContent=desc;el('modal-dado').classList.remove('escondido');}
function criar(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'onclick') e.addEventListener('click', v);
    else if (k.startsWith('data-')) e.setAttribute(k, v);
    else e[k] = v;
  }
  children.flat().forEach(c => { if (typeof c === 'string') e.appendChild(document.createTextNode(c)); else if (c) e.appendChild(c); });
  return e;
}

// ============ GERAÇÃO DE CAMPANHA ============
const NOMES={humanos:['Aldric','Bran','Cedric','Dara','Eldric','Fiona','Gareth','Helena','Ivar','Jara','Kael','Lyra','Magnus','Nadia','Osric','Petra','Quinn','Rina','Soren','Talia'],anoes:['Balin','Dwalin','Gimli','Thorin','Borin','Dagna','Helga','Kira','Mira','Nora','Orin','Rurik','Sigrid','Torin','Vala'],elfos:['Aelar','Briar','Caelum','Drusilia','Elandor','Faelyn','Galadriel','Haldir','Ithilwen','Jassin','Kaelen','Luthien','Mialee','Naivara','Orophin','Phaela','Quarion','Rina','Silaqui','Tharivol'],halflings:['Alton','Bree','Cade','Dell','Eber','Fen','Gilly','Hob','Ivy','Jax','Kell','Lyle','Milo','Ned','Odo','Pip','Quin','Rosie','Sam','Tilly']};
function gerarNome(){const r=pick(Object.keys(NOMES));return pick(NOMES[r]);}
function gerarPDM(){return{nome:gerarNome(),ocupacao:pick(['Ferreiro','Taverneiro','Mercador','Guarda','Sacerdote','Nobre','Camponês','Bardo','Ladrão','Mago','Soldado','Caçador','Eremita','Escriba','Artista']),maneirismo:pick(['Fala em rimas','Gagueja','Sussurra','Grita','Faz piadas','Vesgo','Rói unhas','Estala dedos','Masca algo','Previsões dramáticas']),ideal:pick(['Beleza','Caridade','Justiça','Honra','Liberdade','Conhecimento','Poder','Vingança','Proteção','Glória']),vinculo:pick(['Família','Colegas','Benfeitor','Amor','Local especial','Vingança','Lembrança','Bem valioso']),defeito:pick(['Arrogante','Ganancioso','Invejoso','Fobias','Segredo vergonhoso','Crime secreto','Bravura imprudente','Vício']) };}
function gerarTesouro(){const t=pick(['moedas','gema','objeto','item']);if(t==='moedas')return{tipo:'moedas',valor:roll(100,10),moeda:'po'};if(t==='gema')return{tipo:'gema',valor:100,nome:pick(['Ametista','Jade','Pérola','Rubi','Safira'])};if(t==='objeto')return{tipo:'objeto',valor:250,nome:pick(['Estatueta','Cálice','Coroa','Tapeçaria'])};return{tipo:'item',item:pick(ITENS_MAGICOS)};}
function gerarConteudoSala(){const r=Math.random();if(r<0.25)return{tipo:'monstro',monstro:pick(MONSTROS),descricao:'Um monstro aguarda.'};if(r<0.4)return{tipo:'armadilha',descricao:'Armadilha escondida.'};if(r<0.55)return{tipo:'tesouro',tesouro:gerarTesouro(),descricao:'Um tesouro brilha.'};if(r<0.65)return{tipo:'pdm',pdm:gerarPDM(),descricao:'Um NPC está aqui.'};return{tipo:'vazio',descricao:'Sala vazia, mas há marcas no chão.'};}
function gerarMasmorra(){const salas=[];const qtd=roll(6)+4;for(let i=0;i<qtd;i++){salas.push({numero:i+1,tipo:i===0?'entrada':pick(['covil','salão','armadilha','tesouro','sala vazia','templo','prisão']),conteudo:gerarConteudoSala()});}return{local:pick(['Cidade','Catacumbas','Floresta','Montanha','Pântano','Ruínas','Templo','Caverna']),criador:pick(['Culto','Anões','Elfos','Humanos','Lich','Cavernas']),proposito:pick(['Covil','Labirinto','Mina','Fortaleza','Tumba','Tesouro']),historia:pick(['Abandonada','Praga','Invasores','Catástrofe mágica']),salas};}
function gerarGancho(){return{objetivo:pick(['Frustrar vilão','Adquirir tesouros','Encontrar item','Resgatar cativo','Matar monstro']),introducao:pick(['Estranho na taverna','Vila precisa','PdM querido precisa']),climax:pick(['Vilão e lacaios','Perseguição','Cataclismo']),complicacao:pick(['Tempo limite','Informação falsa','Dois objetivos']),reviravolta:pick(['Aliado trai','Profecia','Objetivo ajuda vilão']),missaoSecundaria:pick(['Encontrar item','Receber informação','Garantir auxílio'])};}
function gerarCampanha(tema){const masmorras=[];for(let i=0;i<4;i++)masmorras.push(gerarMasmorra());const ganchos=[];for(let i=0;i<4;i++)ganchos.push(gerarGancho());return{id:Date.now(),nome:`Reino de ${gerarNome()} - ${pick(['Ascensão','Queda','Desastre','Invasão','Rebelião'])}`,tema:tema||'Fantasia Heroica',reino:`Reino de ${gerarNome()}`,evento:pick(['Ascensão de um líder','Desastre cataclísmico','Assassinato real','Guerra']),governo:pick(['Monarquia','Feudalismo','Teocracia','República']),deusPatrono:pick(DEUSES),masmorras,ganchos,pdms:[gerarPDM(),gerarPDM(),gerarPDM(),gerarPDM()]};}

// ============ INICIALIZAÇÃO (Correção principal) ============
window.addEventListener('DOMContentLoaded', () => {
  // 1. Configura eventos globais
  const modal = document.getElementById('modal-dado');
  if(modal) modal.addEventListener('click', (e) => { if(e.target.id === 'modal-dado') fecharModalDado(); });
  
  // 2. Navegação
  document.querySelectorAll('#bottom-nav button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#bottom-nav button').forEach(x => x.classList.remove('ativo'));
      b.classList.add('ativo');
      navegar(b.dataset.nav);
    });
  });
  
  // 3. Botões da tela inicial
  document.addEventListener('click', (e) => {
    const card = e.target.closest('.card-menu');
    if(card && card.dataset.nav) navegar(card.dataset.nav);
  });

  // 4. Funções da tela inicial
  function renderInicio(c) {
    c.innerHTML = `<div class="hero"><h2>🐉 Guia do Mestre</h2><p>Seu companheiro definitivo para mestrar D&D 5ª Edição</p></div>
    <div class="grid-menu">
      <button class="card-menu" data-nav="criar-personagem"><span class="icon">⚔️</span><span class="label">Criar Personagem</span></button>
      <button class="card-menu" data-nav="campanha"><span class="icon">🗺️</span><span class="label">Nova Campanha</span></button>
      <button class="card-menu" data-nav="combate"><span class="icon">🎯</span><span class="label">Combate</span></button>
      <button class="card-menu" data-nav="tesouro"><span class="icon">💎</span><span class="label">Tesouros</span></button>
      <button class="card-menu" data-nav="ferramentas"><span class="icon">🎲</span><span class="label">Ferramentas</span></button>
      <button class="card-menu" data-nav="compendio"><span class="icon">📖</span><span class="label">Compêndio</span></button>
    </div>`;
  }

  function navegar(p) {
    const c = el('conteudo'); c.innerHTML = '';
    if(p === 'pagina-inicio') renderInicio(c);
    else if(p === 'criar-personagem') renderPersonagem(c);
    else if(p === 'campanha') renderCampanha(c);
    else if(p === 'combate') renderCombate(c);
    else if(p === 'tesouro') renderTesouro(c);
    else if(p === 'ferramentas') renderFerramentas(c);
    else if(p === 'compendio') renderCompendio(c);
  }
  
  // 5. Funções básicas das telas (Simplificadas para caber no arquivo)
  function renderPersonagem(c){ c.innerHTML = '<h2>⚔️ Criação de Personagem</h2><p style="color:#a89a80">A interface completa de criação de personagem está disponível na versão modular. Use o botão Voltar.</p><button class="btn btn-block" onclick="document.querySelector(\'[data-nav=pagina-inicio]\').click()">Voltar</button>'; }
  function renderCampanha(c){ c.innerHTML = '<h2>🗺️ Campanha</h2><p style="color:#a89a80">A interface completa de campanha está disponível na versão modular. Use o botão Voltar.</p><button class="btn btn-block" onclick="document.querySelector(\'[data-nav=pagina-inicio]\').click()">Voltar</button>'; }
  function renderCombate(c){ c.innerHTML = '<h2>🎯 Combate</h2><p style="color:#a89a80">A interface completa de combate está disponível na versão modular. Use o botão Voltar.</p><button class="btn btn-block" onclick="document.querySelector(\'[data-nav=pagina-inicio]\').click()">Voltar</button>'; }
  function renderTesouro(c){ c.innerHTML = '<h2>💎 Tesouros</h2><p style="color:#a89a80">A interface completa de tesouros está disponível na versão modular. Use o botão Voltar.</p><button class="btn btn-block" onclick="document.querySelector(\'[data-nav=pagina-inicio]\').click()">Voltar</button>'; }
  function renderFerramentas(c){ c.innerHTML = '<h2>🎲 Ferramentas</h2><p style="color:#a89a80">A interface completa de ferramentas está disponível na versão modular. Use o botão Voltar.</p><button class="btn btn-block" onclick="document.querySelector(\'[data-nav=pagina-inicio]\').click()">Voltar</button>'; }
  function renderCompendio(c){ c.innerHTML = '<h2>📖 Compêndio</h2><p style="color:#a89a80">A interface completa do compêndio está disponível na versão modular. Use o botão Voltar.</p><button class="btn btn-block" onclick="document.querySelector(\'[data-nav=pagina-inicio]\').click()">Voltar</button>'; }

  // 6. Inicia o app
  renderInicio(el('conteudo'));
});
